# Brings Holm's new work (ademerci/Holm, main) into HolyNotch every day.
# A clean merge whose tests pass goes straight to main and starts "HolyNotch release" (which publishes only when the
# version in Holm.App.csproj is new). A merge with conflicts, or failing tests, opens an issue instead: nothing is
# pushed until someone resolves it (merge upstream/main by hand, keep the HolyNotch names).
#
# GitHub doesn't let the workflow's own token push changes to .github/workflows. When Holm changes one of its
# workflows, the final publish job needs the SYNC_TOKEN secret: a fine-grained token for this repository only with
# "Contents: Read and write" and "Workflows: Read and write". Without it such a sync ends in an issue too.
name: Sync with Holm

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:

concurrency:
  group: holynotch-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/ademerci/Holm.git

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.merge.outputs.result }}
      upstream: ${{ steps.merge.outputs.upstream }}
      base: ${{ steps.merge.outputs.base }}
      tree: ${{ steps.merge.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge Holm's main
        id: merge
        run: |
          git config user.name "HolyNotch sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main
          base=$(git rev-parse HEAD)
          upstream=$(git rev-parse upstream/main)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Nothing new in Holm."
            echo "result=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git merge --no-edit -m "Merge ademerci/Holm main ($(git rev-parse --short upstream/main)) into main" upstream/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
            echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: steps.merge.outputs.result == 'merged'
        with:
          dotnet-version: "10.0.x"

      - name: Test
        id: test
        if: steps.merge.outputs.result == 'merged'
        run: dotnet test Holm.Tests -c Release --filter "Category!=Local&Category!=Online&Category!=Manual&FullyQualifiedName!~UpdateInstallerTests"

      - name: Upload conflict list
        if: steps.merge.outputs.result == 'conflict'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sync-conflicts
          path: conflicts.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sync
    if: needs.sync.outputs.result == 'merged'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # starts HolyNotch release after the tested merge is pushed
    env:
      BASE_SHA: ${{ needs.sync.outputs.base }}
      UPSTREAM_SHA: ${{ needs.sync.outputs.upstream }}
      MERGE_TREE: ${{ needs.sync.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Push the tested merge and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreate the merge from the same immutable commits, then prove its tree is exactly what the tests saw.
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "::error::main changed after the sync tests"; exit 1; }
          git config user.name "HolyNotch sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA" || { echo "::error::The upstream commit changed"; exit 1; }
          short=$(git rev-parse --short FETCH_HEAD)
          git merge --no-edit -m "Merge ademerci/Holm main ($short) into main" "$UPSTREAM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$MERGE_TREE" || { echo "::error::The merge tree differs from the tested tree"; exit 1; }
          git push origin HEAD:main
          gh workflow run holynotch-release.yml --ref main -R "$GITHUB_REPOSITORY"

  report:
    needs: [sync, publish]
    if: always() && (needs.sync.result != 'success' || needs.sync.outputs.result == 'conflict' || needs.publish.result == 'failure' || needs.publish.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RESULT: ${{ needs.sync.outputs.result }}
      UPSTREAM_SHA: ${{ needs.sync.outputs.upstream }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download conflict list
        if: needs.sync.outputs.result == 'conflict'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sync-conflicts
          path: .

      - name: Ask for help in an issue
        run: |
          title="Sync with Holm needs a hand"
          {
            if [ "$RESULT" = "conflict" ]; then
              echo "Holm's main ($UPSTREAM_SHA) doesn't merge cleanly into HolyNotch. Conflicting files:"
              echo; sed 's/^/- `/; s/$/`/' conflicts.txt
            elif [ "$RESULT" = "merged" ]; then
              echo "Holm's main ($UPSTREAM_SHA) merged, but the tests or the push failed (a push that changes"
              echo "\`.github/workflows\` needs the \`SYNC_TOKEN\` secret, see holynotch-sync.yml)."
            else
              echo "The sync could not fetch or merge Holm's main ($UPSTREAM_SHA). Nothing was pushed."
            fi
            echo
            echo "Resolve by hand: \`git fetch https://github.com/ademerci/Holm.git main && git merge FETCH_HEAD\`,"
            echo "keep the HolyNotch names, run the tests, push to main."
            echo
            echo "Run: $RUN"
          } > body.md
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body-file body.md
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file body.md; fi
