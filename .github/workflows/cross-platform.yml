# Builds and tests Holm on Windows and Linux.
name: Cross-platform

on:
  push:
    paths: ["Holm.*/**", "Holm.slnx", "tools/selftest/**", ".github/workflows/cross-platform.yml"]
    branches: ["main", "dev"]
  pull_request:
    paths: ["Holm.*/**", "Holm.slnx", "tools/selftest/**", ".github/workflows/cross-platform.yml"]
  workflow_dispatch:

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Both systems must pass: the app is meant to look and work the same on each. Never drop one of the two from
    # this matrix, nor from release.yml and dev-release.yml (AGENTS.md: every build is for Windows and Linux).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        # Not the solution: it also holds the Windows backend, which only builds on Windows.
        run: dotnet build Holm.App -c Release && dotnet build Holm.Tests -c Release

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: dotnet test Holm.Tests -c Release --no-build --filter "Category!=Local&Category!=Online&Category!=Manual"

      # The updater replaces Holm.exe through PowerShell: Windows only by design, so its tests stay out here.
      - name: Test (Linux)
        if: matrix.os != 'windows-latest'
        run: dotnet test Holm.Tests -c Release --no-build --filter "Category!=Local&Category!=Online&Category!=Manual&FullyQualifiedName!~UpdateInstallerTests"

      # The app itself, started on each system without a person: it opens the notch, reads what the backend offers,
      # saves a picture of the closed and the open notch and quits. A native call declared wrong crashes it here, and
      # both systems' pictures, laid over each other, show whether the notch still looks the same on each.
      - name: Self-test (Linux)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 3
        run: HOLM_SELFTEST="$PWD/selftest" xvfb-run -a -s "-screen 0 1920x1080x24" dotnet run --project Holm.App -c Release --no-build

      - name: Self-test (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        shell: bash
        run: HOLM_SELFTEST="$PWD/selftest" dotnet run --project Holm.App -c Release --no-build

      - name: Upload self-test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selftest-${{ runner.os }}
          path: selftest/
          retention-days: 7
          if-no-files-found: warn

      # The Linux build as people would get it: self-contained, one file. Kept for a few days to try out; it is
      # a test build of an experimental branch, not a release.
      - name: Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish Holm.App -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none -o out/linux-x64

      - name: Upload (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Holm-linux-x64-test-build.${{ github.run_number }}
          path: out/linux-x64/
          retention-days: 7

      # The Windows build as people would get it: self-contained, one file, named as a test build (AGENTS.md).
      - name: Publish (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          dotnet publish Holm.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none -o out/win-x64
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Holm.App/Holm.App.csproj | head -1)
          mv out/win-x64/Holm.App.exe "out/win-x64/Holm-$version-test-build.$GITHUB_RUN_NUMBER.exe"

      - name: Check the file version (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Select-String -Path Holm.App/Holm.App.csproj -Pattern '<Version>(.*)</Version>').Matches[0].Groups[1].Value

          # Holm 1.12's updater replaces Holm.exe only when the new file's version is exactly the release's (x.y.z.0).
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "out/win-x64/Holm-$version-test-build.$env:GITHUB_RUN_NUMBER.exe").Path)
          $file = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
          if ($file -ne "$version.0") { throw "The exe's file version is $file, not $version.0: the 1.12 updater would refuse it." }
          if ($info.ProductName -ne "Holm") { throw "The exe's product name is '$($info.ProductName)', not 'Holm': every updater would refuse it." }
          Write-Host "File version $file, as the 1.12 updater expects"

      - name: Upload (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Holm-win-x64-test-build.${{ github.run_number }}
          path: out/win-x64/
          retention-days: 7

  # Both systems' self-test pictures laid over each other: the notch must look the same on each.
  compare:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: selftest-*
          path: selftest

      - name: Compare
        run: |
          # Pillow 12.0.0 wheels for CPython 3.10-3.14 on Linux x86_64, hashes published by PyPI.
          python3 -m pip install --quiet --require-hashes --only-binary=:all: pillow==12.0.0 \
            --hash=sha256:c7b2a63fd6d5246349f3d3f37b14430d73ee7e8173154461785e43036ffa96ca \
            --hash=sha256:d77153e14b709fd8b8af6f66a3afbb9ed6e9fc5ccf0b6b7e1ced7b036a228782 \
            --hash=sha256:5269cc1caeedb67e6f7269a42014f381f45e2e7cd42d834ede3c703a1d915fe3 \
            --hash=sha256:bee2a6db3a7242ea309aa7ee8e2780726fed67ff4e5b40169f2c940e7eb09227 \
            --hash=sha256:82240051c6ca513c616f7f9da06e871f61bfd7805f566275841af15015b8f98d \
            --hash=sha256:b87843e225e74576437fd5b6a4c2205d422754f84a06942cfaf1dc32243e45a8 \
            --hash=sha256:a6597ff2b61d121172f5844b53f21467f7082f5fb385a9a29c01414463f93b07 \
            --hash=sha256:f4f1231b7dec408e8670264ce63e9c71409d9583dd21d32c163e25213ee2a344 \
            --hash=sha256:38df9b4bfd3db902c9c2bd369bcacaf9d935b2fff73709429d95cc41554f7b3d \
            --hash=sha256:aff9e4d82d082ff9513bdd6acd4f5bd359f5b2c870907d2b0a9c5e10d40c88fe \
            --hash=sha256:f13711b1a5ba512d647a0e4ba79280d3a9a045aaf7e0cc6fbe96b91d4cdf6b0c \
            --hash=sha256:c98fa880d695de164b4135a52fd2e9cd7b7c90a9d8ac5e9e443a24a95ef9248e
          python3 tools/selftest/compare.py selftest compare

      - name: Upload differences
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selftest-differences
          path: compare/
          retention-days: 7
          if-no-files-found: ignore
