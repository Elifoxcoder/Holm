# HolyNotch server behind nginx (server/README.md): TLS here, everything else in the Node service on 127.0.0.1:8480.
# certbot --nginx adds the certificate lines and the redirect from port 80.
map $http_upgrade $holynotch_connection { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name HOLYNOTCH_HOST;

    client_max_body_size 2m;

    # The Android APKs and latest.json (same files as :8473), for the download page.
    location /android/ {
        alias /var/www/holm/;
        types { application/vnd.android.package-archive apk; application/json json; }
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $holynotch_connection;
        proxy_read_timeout 1h;   # a followed inbox is one long WebSocket (pinged every 30 s)
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
